name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: '1.25.x'

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: backend/go.sum

    - name: Install SQLite dependencies
      run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

    - name: Run Go tests with coverage
      working-directory: ./backend
      run: CGO_ENABLED=1 go test -tags "fts5 sqlite_crypt" -v -coverprofile=coverage.out -covermode=atomic ./...

    - name: Generate Go coverage summary
      if: always()
      working-directory: ./backend
      run: |
        if [ -f coverage.out ]; then
          go tool cover -func=coverage.out | tail -1
          echo "## Backend Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out | tail -20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload Go coverage report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: backend-coverage
        path: backend/coverage.out
        retention-days: 14

    - name: Run API contract smoke tests
      working-directory: ./backend
      run: CGO_ENABLED=1 go test -tags "fts5 sqlite_crypt" -v ./internal/api -run TestAPIContractSmoke

    - name: Run Go vet
      working-directory: ./backend
      run: CGO_ENABLED=1 go vet -tags "fts5" ./...

    - name: Run Go fmt check
      working-directory: ./backend
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "Go code is not formatted:"
          gofmt -d .
          exit 1
        fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: backend/go.sum

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

    - name: Run govulncheck
      working-directory: ./backend
      run: govulncheck ./...

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: backend/go.sum

    - name: Install SQLite dependencies
      run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

    - name: Pre-build backend for E2E
      working-directory: ./backend
      run: CGO_ENABLED=1 go build -tags "fts5" -o /tmp/xelanote-test ./cmd/server

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run Vitest unit tests with coverage
      working-directory: ./frontend
      run: npm run test:coverage

    - name: Generate frontend coverage summary
      if: always()
      working-directory: ./frontend
      run: |
        if [ -f coverage/coverage-summary.json ]; then
          echo "## Frontend Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          node -e "
            const s = require('./coverage/coverage-summary.json').total;
            for (const [k, v] of Object.entries(s)) {
              console.log(k.padEnd(12) + ': ' + v.pct + '%');
            }
          " >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload frontend coverage report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: frontend-coverage
        path: frontend/coverage/
        retention-days: 14

    - name: Run ESLint
      working-directory: ./frontend
      run: npx eslint --no-warn-ignored --max-warnings 0 .

    - name: Run Prettier check
      working-directory: ./frontend
      run: npm run format:check

    - name: Run markdownlint
      working-directory: ./frontend
      run: npm run lint:md

    - name: Run Svelte check
      working-directory: ./frontend
      run: npm run check

    - name: Install Playwright browsers
      working-directory: ./frontend
      run: npx playwright install --with-deps chromium

    - name: Run Playwright E2E tests
      working-directory: ./frontend
      run: npx playwright test --project=e2e --grep-invert "visual regression|consistency screenshots"

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 7

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, security-scan]

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: backend/go.sum

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install SQLite dependencies
      run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

    - name: Build project
      run: make build

    - name: Verify binary exists
      run: test -f bin/xelanote && echo "Binary created successfully"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Build Docker image
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
      with:
        context: .
        push: false
        tags: xelanote:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max
