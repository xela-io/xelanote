    <meta name="theme-color" content="#458588" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#282828" media="(prefers-color-scheme: dark)" />

    <!-- FOUC Prevention: Apply theme + background BEFORE anything else loads -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('xelanote-theme');
          // Theme -> className + background color mapping (must match themes/index.ts + app.css)
          var themes = {
            'gruvbox-light': { cls: 'theme-gruvbox-light', bg: '#fbf1c7', tc: '#458588' },
            'gruvbox-dark': { cls: 'theme-gruvbox-dark', bg: '#282828', tc: '#282828' },
          };
          // Validierung - fallback zu Gruvbox
          if (!theme || !(theme in themes)) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'gruvbox-dark'
              : 'gruvbox-light';
          }
          var t = themes[theme];
          // Apply className
          if (t.cls) {
            document.documentElement.classList.add(t.cls);
          }
          // Apply background immediately to prevent flash
          document.documentElement.style.backgroundColor = t.bg;
          // Update existing theme-color meta tags
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          metas.forEach(function (m) {
            m.content = t.tc;
          });
        } catch (e) {}
      })();
    </script>
