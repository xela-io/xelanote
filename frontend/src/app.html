<!doctype html>
<html lang="en" style="background-color: #111">
  <head>
    <meta charset="utf-8" />

    <!-- FOUC Prevention: Apply theme + background BEFORE anything else loads -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('xelanote-theme');
          // Theme -> className + background color mapping (must match themes/index.ts + app.css)
          var themes = {
            'gruvbox-light': { cls: 'theme-gruvbox-light', bg: '#fbf1c7', tc: '#458588' },
            'gruvbox-dark': { cls: 'theme-gruvbox-dark', bg: '#282828', tc: '#282828' },
          };
          // Validierung - fallback zu Gruvbox
          if (!theme || !(theme in themes)) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'gruvbox-dark'
              : 'gruvbox-light';
          }
          var t = themes[theme];
          // Apply className
          if (t.cls) {
            document.documentElement.classList.add(t.cls);
          }
          // Apply background immediately to prevent flash
          document.documentElement.style.backgroundColor = t.bg;
          // Set theme-color meta tag dynamically
          var meta = document.createElement('meta');
          meta.name = 'theme-color';
          meta.content = t.tc;
          document.head.appendChild(meta);
        } catch (e) {}
      })();
    </script>

    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover"
    />

    <!-- Note: CSP disabled in development mode (Vite HMR requires 'unsafe-inline')
		     In production, set CSP via HTTP headers in backend/Caddy instead of meta tag -->

    <title>xelanote</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
