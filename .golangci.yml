version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - fts5
    - sqlite_crypt

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - revive
    - misspell
    - bodyclose
    - gocritic
    - unused
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - ifElseChain
        - exitAfterDefer
        - commentedOutCode
        - deprecatedComment
        - sprintfQuotedString
    errcheck:
      exclude-functions:
        - (*database/sql.Tx).Rollback
        - (*database/sql.Row).Scan
        - (*database/sql.DB).Exec
        - (net/http.ResponseWriter).Write
        - (*github.com/gorilla/websocket.Conn).SetReadDeadline
        - (*github.com/gorilla/websocket.Conn).SetWriteDeadline
        - (*github.com/gorilla/websocket.Conn).WriteMessage
        - (*github.com/gorilla/websocket.Conn).Close
        - golang.org/x/crypto/bcrypt.CompareHashAndPassword
        - path/filepath.WalkDir
        # defer .Close() on readers/writers/db resources — errors not actionable
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*os.File).Close
        - (*archive/zip.Writer).Close
        - (*net/http.Response).Body.Close
        - io.ReadCloser.Close
        # SSE streaming — fprintf errors handled by connection close
        - fmt.Fprintf
        # Cleanup operations — best-effort, errors not actionable
        - os.Remove
        - os.RemoveAll
    staticcheck:
      checks:
        - "all"
        - "-QF*" # Quickfix suggestions — not errors, just style preferences
        - "-ST*" # Style conventions — too noisy, enforced by code review instead
  exclusions:
    generated: lax
    paths:
      - vendor
      - testdata
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
          - bodyclose
      # Intentional misspellings in spell-check prompt examples
      - path: internal/llm/prompts\.go
        linters:
          - misspell
      # Activity logging is fire-and-forget by design
      - linters:
          - errcheck
        text: "activityService\\.Log"
      # Intentional empty branches for idempotent error handling
      - linters:
          - staticcheck
        text: "SA9003"
      # assignOp and sloppyReassign are style preferences, not bugs
      - linters:
          - gocritic
        text: "assignOp|sloppyReassign"
      # S1017 TrimSuffix suggestion — readability preference
      - linters:
          - staticcheck
        text: "S1017"
      # defer .Close() — fire-and-forget on readers/writers/files
      - linters:
          - errcheck
        text: '\.Close\('
