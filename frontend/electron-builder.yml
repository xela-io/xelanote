# Electron Builder Configuration
# https://www.electron.build/configuration/configuration

appId: com.xelanote.desktop
productName: xelanote
copyright: Copyright © 2024 xelanote

# Directories
directories:
  buildResources: build
  output: release

# Files to include
files:
  - dist-electron/**/*
  - build/**/*
  - '!**/*.map'

# Linux configuration
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Office
  icon: build/icons
  maintainer: xelanote
  desktop:
    entry:
      Name: xelanote
      Comment: Personal note-taking with wikilinks
      Categories: Office;TextEditor;Utility
      Keywords: notes;markdown;wikilinks;zettelkasten

# Debian package configuration
deb:
  depends:
    - libsecret-1-0
  priority: optional
  compression: xz

# AppImage configuration
appImage:
  artifactName: ${productName}-${version}-${arch}.AppImage

# Build options
asar: true
asarUnpack:
  - '**/*.node'

# Publish (disabled for now)
publish: null
