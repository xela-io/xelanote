<!doctype html>
<html lang="en" style="background-color: #111">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%sveltekit.status% - xelanote</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('xelanote-theme');
          var themes = {
            'gruvbox-light': { bg: '#fbf1c7', fg: '#3c3836', muted: '#928374' },
            'gruvbox-dark': { bg: '#282828', fg: '#ebdbb2', muted: '#928374' },
          };
          if (!theme || !(theme in themes)) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'gruvbox-dark'
              : 'gruvbox-light';
          }
          var t = themes[theme];
          document.documentElement.style.backgroundColor = t.bg;
          document.documentElement.style.setProperty('--fg', t.fg);
          document.documentElement.style.setProperty('--muted', t.muted);
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        --fg: #ebdbb2;
        --muted: #928374;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        color: var(--fg);
      }
      .container {
        text-align: center;
        max-width: 400px;
        padding: 2rem;
      }
      .status {
        font-size: 3rem;
        font-weight: 700;
        margin: 0 0 0.5rem;
        line-height: 1;
      }
      .message {
        font-size: 1rem;
        color: var(--muted);
        margin: 0 0 2rem;
      }
      a {
        display: inline-block;
        padding: 0.5rem 1.5rem;
        border: 1px solid var(--muted);
        border-radius: 0.375rem;
        color: var(--fg);
        text-decoration: none;
        font-size: 0.875rem;
      }
      a:hover {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p class="status">%sveltekit.status%</p>
      <p class="message">%sveltekit.error.message%</p>
      <a href="/">Back to home</a>
    </div>
  </body>
</html>
