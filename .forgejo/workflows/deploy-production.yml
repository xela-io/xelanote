# NOTE: Paths (ENV_FILE, data volumes, ports) are environment-specific.
# Adjust for your infrastructure before using.
name: Deploy to Production

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      reason:
        description: 'Deployment reason (e.g. hotfix, rollback)'
        required: true

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  ENV_FILE: /home/deploy/.xelanote.env  # Adjust to your server's env file location
  IMAGE_NAME: xelanote
  HEALTH_URL: http://localhost:8080/health

jobs:
  deploy:
    runs-on: production
    timeout-minutes: 15

    steps:
      # UPDATE CHECKSUM - verify at: https://code.forgejo.org/actions/checkout/releases/tag/v4
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Pre-flight checks
        run: |
          set -euo pipefail

          echo "--- Checking env-file ---"
          if [ ! -r "$ENV_FILE" ]; then
            echo "::error::ENV_FILE not found or not readable: $ENV_FILE"
            exit 1
          fi

          echo "--- Validating required variables ---"
          REQUIRED_VARS="JWT_SECRET XELANOTE_API_KEY_SECRET CORS_ALLOWED_ORIGINS XELANOTE_DB XELANOTE_ENV TRUSTED_PROXIES"
          for var in $REQUIRED_VARS; do
            val=$(grep "^${var}=" "$ENV_FILE" | head -1 | cut -d'=' -f2-)
            if [ -z "$val" ]; then
              echo "::error::Required variable $var is missing or empty in $ENV_FILE"
              exit 1
            fi
          done

          echo "--- Checking JWT_SECRET length ---"
          JWT_LEN=$(grep "^JWT_SECRET=" "$ENV_FILE" | head -1 | cut -d'=' -f2- | tr -d '[:space:]' | wc -c)
          if [ "$JWT_LEN" -lt 64 ]; then
            echo "::error::JWT_SECRET must be at least 64 characters (found: $JWT_LEN)"
            exit 1
          fi

          echo "--- Checking XELANOTE_API_KEY_SECRET length ---"
          API_KEY_SECRET_LEN=$(grep "^XELANOTE_API_KEY_SECRET=" "$ENV_FILE" | head -1 | cut -d'=' -f2- | tr -d '[:space:]' | wc -c)
          if [ "$API_KEY_SECRET_LEN" -lt 64 ]; then
            echo "::error::XELANOTE_API_KEY_SECRET must be at least 64 characters (found: $API_KEY_SECRET_LEN)"
            exit 1
          fi

          echo "--- Checking key separation ---"
          JWT_SECRET_VAL=$(grep "^JWT_SECRET=" "$ENV_FILE" | head -1 | cut -d'=' -f2- | tr -d '[:space:]')
          API_KEY_SECRET_VAL=$(grep "^XELANOTE_API_KEY_SECRET=" "$ENV_FILE" | head -1 | cut -d'=' -f2- | tr -d '[:space:]')
          if [ "$JWT_SECRET_VAL" = "$API_KEY_SECRET_VAL" ]; then
            echo "::error::XELANOTE_API_KEY_SECRET must differ from JWT_SECRET"
            exit 1
          fi

          echo "--- Checking XELANOTE_ENV is production ---"
          XELANOTE_ENV=$(grep "^XELANOTE_ENV=" "$ENV_FILE" | head -1 | cut -d'=' -f2- | tr -d '[:space:]')
          if [ "$XELANOTE_ENV" != "production" ]; then
            echo "::error::XELANOTE_ENV must be 'production' (found: '$XELANOTE_ENV')"
            exit 1
          fi

          echo "--- Checking Docker daemon ---"
          if ! docker info > /dev/null 2>&1; then
            echo "::error::Docker daemon is not reachable"
            exit 1
          fi

          echo "--- Reading previous image for rollback ---"
          PREV_IMAGE=$(docker inspect "$IMAGE_NAME" --format '{{.Config.Image}}' 2>/dev/null || echo "")
          if [ -n "$PREV_IMAGE" ]; then
            echo "Previous image: $PREV_IMAGE"
          else
            echo "::warning::No previous container found (first deploy?)"
          fi
          echo "PREV_IMAGE=$PREV_IMAGE" >> "$GITHUB_ENV"

          echo "All pre-flight checks passed"

      - name: Build image
        run: |
          set -euo pipefail

          # Use tag name for tagged releases, commit SHA for manual dispatch
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=$(echo "${{ github.sha }}" | cut -c1-12)
          fi
          echo "Building image with tag: $TAG"

          docker build --build-arg VERSION="$TAG" -t "$IMAGE_NAME:$TAG" -t "$IMAGE_NAME:latest" .

          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Prepare run flags
        run: |
          set -euo pipefail

          RUN_FLAGS="--detach \
            --name $IMAGE_NAME \
            --restart unless-stopped \
            -p 127.0.0.1:8080:8080 \
            -v /home/deploy/xelanote-data:/app/data \
            --env-file $ENV_FILE \
            --memory=512m --cpus=1 --pids-limit=200 \
            --security-opt no-new-privileges --cap-drop ALL \
            --read-only --tmpfs /tmp \
            --log-driver json-file --log-opt max-size=10m --log-opt max-file=3"

          echo "RUN_FLAGS<<EOF" >> "$GITHUB_ENV"
          echo "$RUN_FLAGS" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Pre-deploy backup
        run: |
          set -euo pipefail

          # Use runner home (writable via ReadWritePaths in systemd)
          BACKUP_DIR="/var/lib/forgejo-runner/backups"
          mkdir -p "$BACKUP_DIR"

          DB_PATH="/home/deploy/xelanote-data/xelanote.db"  # Adjust to your data directory
          if [ -f "$DB_PATH" ]; then
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            echo "Creating pre-deploy backup..."
            cp "$DB_PATH" "$BACKUP_DIR/xelanote_predeploy_${TIMESTAMP}.db"

            # Keep only last 5 pre-deploy backups
            ls -t "$BACKUP_DIR"/xelanote_predeploy_*.db 2>/dev/null | tail -n +6 | xargs rm -f 2>/dev/null || true
            echo "Backup created: xelanote_predeploy_${TIMESTAMP}.db"
          else
            echo "::warning::No database found at $DB_PATH (first deploy?)"
          fi

      - name: Stop old container
        run: |
          set -euo pipefail

          if docker ps -a --format '{{.Names}}' | grep -q "^${IMAGE_NAME}$"; then
            echo "Stopping old container (30s grace period)..."
            docker stop --timeout 30 "$IMAGE_NAME" || true
            docker rm "$IMAGE_NAME" || true
          else
            echo "No existing container to stop"
          fi

      - name: Start new container
        run: |
          set -euo pipefail

          echo "Starting container with image: $IMAGE_NAME:$IMAGE_TAG"
          docker run $RUN_FLAGS "$IMAGE_NAME:$IMAGE_TAG"

      - name: Health check
        id: healthcheck
        run: |
          set -euo pipefail

          echo "Waiting for container to become healthy..."
          MAX_ATTEMPTS=30
          SLEEP_SECONDS=2

          for i in $(seq 1 $MAX_ATTEMPTS); do
            RESPONSE=$(curl -fsS "$HEALTH_URL" 2>/dev/null || echo "")
            if [ "$RESPONSE" = "ok" ]; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i/$MAX_ATTEMPTS: not ready (response: '$RESPONSE')"
            sleep $SLEEP_SECONDS
          done

          echo "::error::Health check failed after $MAX_ATTEMPTS attempts ($(( MAX_ATTEMPTS * SLEEP_SECONDS ))s)"
          exit 1

      - name: Auto-rollback on failure
        if: failure() && steps.healthcheck.outcome == 'failure' && env.PREV_IMAGE != ''
        run: |
          set -euo pipefail

          echo "::warning::Health check failed - rolling back to $PREV_IMAGE"

          docker stop --timeout 5 "$IMAGE_NAME" 2>/dev/null || true
          docker rm "$IMAGE_NAME" 2>/dev/null || true

          echo "Starting rollback container with: $PREV_IMAGE"
          docker run $RUN_FLAGS "$PREV_IMAGE"

          echo "Rollback container started. Verifying health..."
          sleep 5
          RESPONSE=$(curl -fsS "$HEALTH_URL" 2>/dev/null || echo "")
          if [ "$RESPONSE" = "ok" ]; then
            echo "Rollback successful - previous version is healthy"
          else
            echo "::error::Rollback container also unhealthy (response: '$RESPONSE')"
          fi

          echo "::error::Deployment failed - rolled back to $PREV_IMAGE"
          exit 1

      - name: Cleanup old images and cache
        if: success()
        run: |
          set -euo pipefail

          # Keep only the 5 most recent tagged xelanote images (more conservative than staging)
          KEEP=5
          OLD_IMAGES=$(docker images "$IMAGE_NAME" --format '{{.Tag}} {{.CreatedAt}}' \
            | grep -v latest \
            | sort -k2 -r \
            | tail -n +$((KEEP + 1)) \
            | awk '{print "'"$IMAGE_NAME"':" $1}')

          if [ -n "$OLD_IMAGES" ]; then
            echo "Removing old images (keeping $KEEP most recent):"
            echo "$OLD_IMAGES"
            echo "$OLD_IMAGES" | xargs docker rmi 2>/dev/null || true
          else
            echo "No old images to remove"
          fi

          # Prune dangling images
          docker image prune -f

          # Prune build cache older than 24h, keep max 2GB
          docker builder prune --filter "until=24h" --keep-storage=2GB -f

          # Clean runner cache (checkout artifacts older than 7 days)
          find /var/lib/forgejo-runner/.cache -type d -mindepth 2 -maxdepth 2 -mtime +7 -exec rm -rf {} + 2>/dev/null || true

          echo "Cleanup complete"
          df -h / | tail -1

      - name: Summary
        if: always()
        run: |
          TAG="${IMAGE_TAG:-unknown}"
          TRIGGER="${{ github.event_name }}"
          if [ "$TRIGGER" = "workflow_dispatch" ]; then
            REASON="${{ github.event.inputs.reason }}"
            TRIGGER="manual ($REASON)"
          else
            TRIGGER="tag ${{ github.ref_name }}"
          fi

          echo "## Production Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image Tag | \`$IMAGE_NAME:$TAG\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | $TRIGGER |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | https://xelanote.com |" >> "$GITHUB_STEP_SUMMARY"
