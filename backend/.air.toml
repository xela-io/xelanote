# Air - Live reload for Go apps
# https://github.com/air-verse/air

root = "."
tmp_dir = "tmp"

[build]
# Load .env file for development
dotenv = ".env"
# Build command with FTS5 support
cmd = "CGO_ENABLED=1 go build -tags 'fts5 sqlite_crypt' -o ./tmp/main ./cmd/server"
# Binary to run
bin = "./tmp/main"
# Arguments to pass to binary
args = ["-addr", ":8080"]
# Watch these extensions
include_ext = ["go", "tpl", "tmpl", "html"]
# Exclude directories
exclude_dir = ["assets", "tmp", "vendor", "testdata", "node_modules"]
# Exclude files
exclude_file = []
# Exclude regex patterns
exclude_regex = ["_test.go"]
# Exclude unchanged files
exclude_unchanged = false
# Follow symlinks
follow_symlink = false
# Log file (empty = stdout)
log = ""
# Poll files (for network mounts)
poll = false
# Poll interval in ms
poll_interval = 0
# Send interrupt to stop old process (for graceful shutdown)
send_interrupt = true
# Delay after interrupt before killing
kill_delay = "500ms"
# Delay after build to start new process
delay = 100
# Stop on error
stop_on_error = true
# Rerun on binary change
rerun = false
# Rerun delay
rerun_delay = 500

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[log]
time = false
main_only = false

[misc]
# Clean tmp on exit
clean_on_exit = true
