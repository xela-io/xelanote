[package]
name = "xelanote"
version = "0.1.0"
description = "A secure note-taking app with E2E encryption"
authors = ["xela-io"]
license = "MIT"
repository = "https://github.com/xela-io/xelanote"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OS keyring integration
keyring = "3"

# Secure memory clearing
zeroize = "1.7"

# Encrypted fallback storage (AES-256-GCM)
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"

# Platform-specific paths
dirs = "6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
