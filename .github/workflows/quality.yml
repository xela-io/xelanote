name: quality

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_target:
        description: "Which visual workflow to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - visual
          - ui-review
      visual_locale:
        description: "Visual regression locale override (workflow_dispatch only)"
        required: false
        default: "de"
        type: choice
        options:
          - de
          - en
      visual_theme:
        description: "Visual regression theme override (workflow_dispatch only)"
        required: false
        default: "matrix"
        type: choice
        options:
          - matrix
          - gruvbox-light
          - gruvbox-dark

jobs:
  frontend-visual-regression-scope:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.scope.outputs.should_run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin "$BASE_REF" --depth=1
          CHANGED="$(git diff --name-only "origin/$BASE_REF"...HEAD)"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qE '^(frontend/|\.github/workflows/quality\.yml$)'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:md
      - run: npm run typecheck
      - name: Bundle size check
        run: |
          npm run build
          bash ../scripts/check-bundle-size.sh

  frontend-visual-regression:
    needs: [frontend-visual-regression-scope]
    if: |
      needs.frontend-visual-regression-scope.outputs.should_run == 'true' &&
      (
        github.event_name != 'workflow_dispatch' ||
        github.event.inputs.run_target == 'all' ||
        github.event.inputs.run_target == 'visual'
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        visual_variant:
          - slug: de-gruvbox-light
            locale: de
            theme: gruvbox-light
          - slug: de-gruvbox-dark
            locale: de
            theme: gruvbox-dark
    defaults:
      run:
        working-directory: frontend
    env:
      VISUAL_LOCALE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.visual_locale || matrix.visual_variant.locale }}
      VISUAL_THEME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.visual_theme != 'matrix' && github.event.inputs.visual_theme || matrix.visual_variant.theme }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Install sqlite3 dev headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Pre-build backend for Playwright
        working-directory: backend
        run: CGO_ENABLED=1 go build -tags "fts5" -o /tmp/xelanote-test ./cmd/server
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run UI visual regression snapshots
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.visual_theme == 'matrix' || matrix.visual_variant.theme == github.event.inputs.visual_theme
        run: npm run test:e2e:visual
      - name: Skip non-selected visual matrix row
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.visual_theme != 'matrix' && matrix.visual_variant.theme != github.event.inputs.visual_theme
        run: echo "Skipping matrix row ${{ matrix.visual_variant.slug }} for selected theme ${{ github.event.inputs.visual_theme }}"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-visual-report-${{ matrix.visual_variant.slug }}
          path: frontend/playwright-report/
          retention-days: 7
      - name: Upload Playwright visual diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-visual-test-results-${{ matrix.visual_variant.slug }}
          path: frontend/test-results/
          retention-days: 7

  frontend-ui-review-screenshots:
    if: |
      github.event_name == 'workflow_dispatch' &&
      (
        github.event.inputs.run_target == 'all' ||
        github.event.inputs.run_target == 'ui-review'
      )
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Install sqlite3 dev headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Pre-build backend for Playwright
        working-directory: backend
        run: CGO_ENABLED=1 go build -tags "fts5" -o /tmp/xelanote-test ./cmd/server
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Capture UI review screenshots
        run: npm run test:e2e:ui-review
      - name: Upload UI review screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-review-screenshots
          path: frontend/tests/e2e/test-results/ui-review/
          retention-days: 14
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-ui-review-report
          path: frontend/playwright-report/
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Install sqlite3 dev headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: gofmt check
        working-directory: backend
        run: |
          files="$(find . -name '*.go' -not -path './vendor/*')"
          if [ -n "$files" ]; then
            test -z "$(gofmt -l $files)" || (echo "gofmt needed"; exit 1)
          fi
      - name: go vet
        working-directory: backend
        run: CGO_ENABLED=1 go vet -tags "fts5 sqlite_crypt" ./...
      - name: typecheck (compile only)
        working-directory: backend
        run: CGO_ENABLED=1 go test -run TestNonexistent -tags "fts5 sqlite_crypt" ./...

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Link check
        uses: lycheeverse/lychee-action@a8c4c7cb88f0c7386610c35eb25108e448569cb0 # v2
        with:
          args: --config .lychee.toml "README.md" "docs/**/*.md" "CHANGELOG.md"
          fail: true

  env-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check env var sync
        run: bash scripts/check-env-sync.sh

  action-pinning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check GitHub Action pinning policy
        run: bash scripts/check-action-pinning.sh

  binary-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check tracked binary artifacts
        run: bash scripts/check-binary-hygiene.sh

  golangci-lint:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Install sqlite3 dev headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.9.0
          working-directory: backend
          args: --timeout=5m

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: API doc coverage check
        run: bash scripts/check-api-doc-coverage.sh
      - name: Layer violation check
        run: bash scripts/check-layer-violations.sh
      - name: Svelte 4 import check
        run: bash scripts/check-svelte4-imports.sh
      - name: Security pattern check
        run: bash scripts/check-security-patterns.sh

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Check CHANGELOG was updated
        run: |
          # Skip check for docs-only or test-only changes
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          ONLY_DOCS=$(echo "$CHANGED" | grep -cvE '\.(md|txt)$|^docs/' || true)
          ONLY_TESTS=$(echo "$CHANGED" | grep -cvE '_test\.(go|ts|js)$|\.spec\.(ts|js)$|^frontend/tests/' || true)

          if [ "$ONLY_DOCS" -eq 0 ] || [ "$ONLY_TESTS" -eq 0 ]; then
            echo "Docs-only or test-only change, skipping CHANGELOG check"
            exit 0
          fi

          if echo "$CHANGED" | grep -q '^CHANGELOG.md$'; then
            echo "CHANGELOG.md was updated"
          else
            echo "::warning::CHANGELOG.md was not updated. Please add an entry under [Unreleased] if this change is user-facing."
          fi
