name: Playwright Test Suite

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/playwright-tests.yml'
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Which test suite to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - e2e
          - functional
          - accessibility
          - design
          - visual

jobs:
  scope-check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          if echo "$CHANGED" | grep -qE '^(frontend/|\.github/workflows/playwright-tests\.yml$)'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: scope-check
    if: needs.scope-check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: e2e
            project: e2e
          - name: functional
            project: functional
          - name: accessibility
            project: accessibility
          - name: design
            project: design
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install sqlite3 dev headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Pre-build backend
        working-directory: backend
        run: CGO_ENABLED=1 go build -tags "fts5" -o /tmp/xelanote-test ./cmd/server

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run ${{ matrix.suite.name }} tests
        if: |
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.test_suite == 'all' ||
          github.event.inputs.test_suite == matrix.suite.name
        run: CI=true npx playwright test --project=${{ matrix.suite.project }} --reporter=json,html
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.suite.name }}
          path: |
            frontend/tests/reports/
            frontend/tests/results/
          retention-days: 7

      - name: Upload HTML report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.suite.name }}
          path: frontend/tests/reports/html/
          retention-days: 7
