services:
  xelanote:
    build:
      context: .
      dockerfile: Dockerfile
    image: xelanote:latest
    container_name: xelanote
    ports:
      - "127.0.0.1:8081:8080"  # Localhost only (reverse proxy handles external access)
    volumes:
      - xelanote-data:/app/data
    environment:
      - XELANOTE_DB=/app/data/xelanote.db
      - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - xelanote-net
    # Security hardening
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
          pids: 200
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

volumes:
  xelanote-data:

networks:
  xelanote-net:
    driver: bridge
