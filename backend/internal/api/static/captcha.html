<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPTCHA</title>
    <style nonce="__NONCE__">
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 65px;
        }
    </style>
</head>
<body>
    <div id="captcha-widget"></div>
    <script nonce="__NONCE__">
        // Parse URL parameters
        const params = new URLSearchParams(window.location.search);
        const sitekey = params.get('sitekey');
        const theme = params.get('theme') || 'auto';
        const parentOriginParam = params.get('parent_origin');

        function resolveParentOrigin() {
            // Prefer explicit origin from parent iframe URL parameter.
            if (parentOriginParam) {
                if (parentOriginParam === 'null') {
                    return 'null';
                }
                try {
                    const parsed = new URL(parentOriginParam);
                    return parsed.origin;
                } catch (_) {
                    console.error('CAPTCHA: invalid parent_origin parameter');
                }
            }

            // Fallback to referrer origin when available.
            if (document.referrer) {
                try {
                    const parsedReferrer = new URL(document.referrer);
                    return parsedReferrer.origin;
                } catch (_) {
                    console.error('CAPTCHA: invalid document.referrer');
                }
            }

            return '';
        }

        const parentOrigin = resolveParentOrigin();
        // Opaque origins (e.g. custom desktop protocols) serialize to "null".
        // postMessage cannot target those origins explicitly, so "*" is required.
        const postMessageTarget = parentOrigin && parentOrigin !== 'null' ? parentOrigin : '*';

        function postToParent(message) {
            if (!parentOrigin) {
                console.error('CAPTCHA: parent origin unavailable, dropping message');
                return;
            }
            window.parent.postMessage(message, postMessageTarget);
        }

        if (!sitekey) {
            console.error('CAPTCHA: sitekey parameter required');
        }

        // Listen for reset commands from parent
        window.addEventListener('message', function(event) {
            if (event.source !== window.parent) {
                return;
            }
            if (parentOrigin && parentOrigin !== 'null' && event.origin !== parentOrigin) {
                return;
            }
            if (event.data && event.data.type === 'captcha-reset' && window.turnstile && window._widgetId) {
                window.turnstile.reset(window._widgetId);
            }
        });

        // Load Turnstile SDK
        var script = document.createElement('script');
        script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileReady';
        script.async = true;
        document.head.appendChild(script);

        // Render widget when SDK is ready
        window.onTurnstileReady = function() {
            if (!sitekey) return;
            window._widgetId = window.turnstile.render('#captcha-widget', {
                sitekey: sitekey,
                theme: theme,
                callback: function(token) {
                    postToParent({ type: 'captcha-token', token: token });
                },
                'expired-callback': function() {
                    postToParent({ type: 'captcha-expired' });
                },
                'error-callback': function() {
                    postToParent({ type: 'captcha-error' });
                }
            });
        };
    </script>
</body>
</html>
